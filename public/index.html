<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SetorMail Pro - Platform Validasi & Setor Akun Massal</title>
  
  <!-- Font Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eepff',
              100: '#e0e7ff',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>

  <style>
    .glass-card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-input {
      background: rgba(2, 6, 23, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.25);
    }
    .glow-purple {
      box-shadow: 0 0 50px -10px rgba(99, 102, 241, 0.25);
    }
  </style>
</head>
<body class="bg-[#07090e] text-slate-100 min-h-screen font-sans selection:bg-brand-500 selection:text-white" x-data="appData()" x-init="initApp()">

  <!-- Background Ambient Glows -->
  <div class="fixed top-0 left-1/4 w-96 h-96 bg-brand-600/15 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="fixed bottom-0 right-1/4 w-96 h-96 bg-emerald-600/10 rounded-full blur-[140px] pointer-events-none"></div>

  <!-- NAVBAR -->
  <header class="sticky top-0 z-40 border-b border-slate-800/80 bg-[#07090e]/80 backdrop-blur-xl">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      
      <!-- Logo -->
      <div class="flex items-center space-x-3.5">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center text-white shadow-lg shadow-brand-500/30 font-bold text-xl">
          <i data-lucide="mail-check" class="w-6 h-6"></i>
        </div>
        <div>
          <span class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">SetorMail<span class="text-brand-400">.id</span></span>
          <span class="block text-[10px] uppercase font-bold tracking-widest text-brand-400/80">Automated IMAP Engine</span>
        </div>
      </div>

      <!-- Auth User Info -->
      <template x-if="token">
        <div class="flex items-center space-x-5">
          <!-- Saldo Card -->
          <div class="glass-card px-4 py-2 rounded-2xl flex items-center space-x-3">
            <div class="w-8 h-8 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center">
              <i data-lucide="wallet" class="w-4 h-4"></i>
            </div>
            <div>
              <p class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Saldo</p>
              <p class="font-bold text-emerald-400 text-sm leading-tight" x-text="formatRupiah(user.balance || 0)"></p>
            </div>
          </div>

          <!-- User Profile -->
          <div class="flex items-center space-x-3 border-l border-slate-800/80 pl-5">
            <div class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-brand-400 text-sm" x-text="user.name ? user.name.charAt(0).toUpperCase() : 'U'"></div>
            <div class="hidden sm:block">
              <p class="text-sm font-semibold text-white leading-tight" x-text="user.name"></p>
              <p class="text-[11px] text-slate-400" x-text="user.email"></p>
            </div>
            <button @click="logout()" class="p-2 text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-xl transition-all" title="Keluar">
              <i data-lucide="log-out" class="w-5 h-5"></i>
            </button>
          </div>
        </div>
      </template>

    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 relative z-10">
    
    <!-- LOGIN / REGISTER FORM -->
    <template x-if="!token">
      <div class="max-w-md mx-auto my-12 glass-card rounded-3xl p-8 shadow-2xl relative overflow-hidden glow-purple">
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-brand-500/20 rounded-full blur-2xl"></div>
        
        <div class="text-center mb-8 relative">
          <div class="w-14 h-14 bg-brand-600/10 text-brand-400 border border-brand-500/20 rounded-2xl flex items-center justify-center mx-auto mb-4">
            <i data-lucide="shield-check" class="w-7 h-7"></i>
          </div>
          <h2 class="text-2xl font-bold text-white tracking-tight" x-text="isRegister ? 'Buat Akun Baru' : 'Masuk ke Platform'"></h2>
          <p class="text-slate-400 text-xs mt-1.5">Setor kredensial email massal & cairkan saldo otomatis.</p>
        </div>

        <form @submit.prevent="handleAuth()" class="space-y-4">
          <template x-if="isRegister">
            <div>
              <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Nama Lengkap</label>
              <input type="text" x-model="authForm.name" required placeholder="John Doe" class="w-full glass-input rounded-xl px-4 py-3 text-sm text-white focus:outline-none transition">
            </div>
          </template>

          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Alamat Email</label>
            <input type="email" x-model="authForm.email" required placeholder="nama@email.com" class="w-full glass-input rounded-xl px-4 py-3 text-sm text-white focus:outline-none transition">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Password</label>
            <input type="password" x-model="authForm.password" required placeholder="••••••••" class="w-full glass-input rounded-xl px-4 py-3 text-sm text-white focus:outline-none transition">
          </div>

          <button type="submit" class="w-full mt-2 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-brand-600/30 transition-all transform active:scale-[0.98] text-sm">
            <span x-text="isRegister ? 'Daftar Akun Baru' : 'Masuk Dashboard'"></span>
          </button>
        </form>

        <div class="mt-6 text-center border-t border-slate-800/80 pt-5">
          <button @click="isRegister = !isRegister" class="text-xs text-slate-400 hover:text-brand-400 transition font-medium">
            <span x-text="isRegister ? 'Sudah memiliki akun? Login' : 'Belum punya akun? Registrasi gratis'"></span>
          </button>
        </div>
      </div>
    </template>

    <!-- LOGGED DASHBOARD -->
    <template x-if="token">
      <div class="space-y-8">

        <!-- STATS CARDS GRID -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
          
          <div class="glass-card p-6 rounded-3xl hover:border-slate-700/80 transition-all group">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Tarif / Akun Valid</span>
              <div class="w-10 h-10 rounded-2xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center group-hover:scale-110 transition-transform">
                <i data-lucide="badge-percent" class="w-5 h-5"></i>
              </div>
            </div>
            <h3 class="text-3xl font-extrabold text-emerald-400 mt-4">Rp 1.500</h3>
            <p class="text-[11px] text-slate-400 mt-1">Otomatis ditambah ke saldo</p>
          </div>

          <div class="glass-card p-6 rounded-3xl hover:border-slate-700/80 transition-all group">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Total Akun Disetor</span>
              <div class="w-10 h-10 rounded-2xl bg-blue-500/10 text-blue-400 flex items-center justify-center group-hover:scale-110 transition-transform">
                <i data-lucide="layers" class="w-5 h-5"></i>
              </div>
            </div>
            <h3 class="text-3xl font-extrabold text-white mt-4" x-text="submissions.length"></h3>
            <p class="text-[11px] text-slate-400 mt-1">Akun dalam sistem</p>
          </div>

          <div class="glass-card p-6 rounded-3xl hover:border-slate-700/80 transition-all group">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Akun Valid (Approved)</span>
              <div class="w-10 h-10 rounded-2xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center group-hover:scale-110 transition-transform">
                <i data-lucide="check-check" class="w-5 h-5"></i>
              </div>
            </div>
            <h3 class="text-3xl font-extrabold text-indigo-400 mt-4" x-text="submissions.filter(s => s.status === 'approved').length"></h3>
            <p class="text-[11px] text-slate-400 mt-1">Lolos verifikasi IMAP</p>
          </div>

          <div class="glass-card p-6 rounded-3xl hover:border-slate-700/80 transition-all group flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Saldo Dompet</span>
                <div class="w-10 h-10 rounded-2xl bg-brand-500/10 text-brand-400 flex items-center justify-center group-hover:scale-110 transition-transform">
                  <i data-lucide="wallet-cards" class="w-5 h-5"></i>
                </div>
              </div>
              <h3 class="text-2xl font-extrabold text-white mt-2" x-text="formatRupiah(user.balance || 0)"></h3>
            </div>
            <button @click="showWithdrawModal = true" class="mt-4 w-full py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-emerald-600/20 transition-all flex items-center justify-center space-x-2">
              <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
              <span>Cairkan Saldo</span>
            </button>
          </div>

        </div>

        <!-- FORM INPUT MASSAL -->
        <div class="glass-card rounded-3xl p-7 shadow-xl relative">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-5 border-b border-slate-800/80 pb-5">
            <div>
              <h2 class="text-xl font-bold text-white flex items-center gap-2.5">
                <i data-lucide="upload-cloud" class="w-6 h-6 text-brand-400"></i> Setor Akun Email Bulk
              </h2>
              <p class="text-slate-400 text-xs mt-1">
                Format baris: <code class="bg-slate-950 text-brand-300 px-2.5 py-1 rounded-lg border border-slate-800 font-mono">email|password|recovery_email</code>
              </p>
            </div>
            <div class="flex items-center space-x-3">
              <button @click="loadSubmissions()" class="px-3.5 py-2 glass-input text-slate-300 hover:text-white rounded-xl text-xs font-medium flex items-center gap-2 transition">
                <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
                <span>Refresh Status</span>
              </button>
            </div>
          </div>

          <form @submit.prevent="submitBulk()">
            <div class="relative">
              <textarea x-model="rawAccounts" rows="6" class="w-full glass-input rounded-2xl p-4 text-xs font-mono text-slate-200 focus:outline-none transition leading-relaxed placeholder:text-slate-600" placeholder="user1@gmail.com|pass123|recovery1@gmail.com&#10;user2@gmail.com|pass456"></textarea>
              <div class="absolute bottom-4 right-4 px-3 py-1 rounded-lg bg-slate-900/80 border border-slate-800 text-[11px] text-slate-400 font-mono">
                <span x-text="countLines(rawAccounts)"></span> akun terdeteksi
              </div>
            </div>

            <div class="mt-5 flex justify-end">
              <button type="submit" :disabled="loading" class="px-7 py-3 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-brand-600/30 transition-all transform active:scale-95 text-xs flex items-center space-x-2">
                <template x-if="loading">
                  <i data-lucide="loader" class="w-4 h-4 animate-spin"></i>
                </template>
                <i data-lucide="play" class="w-4 h-4" x-show="!loading"></i>
                <span>Mulai Verifikasi IMAP</span>
              </button>
            </div>
          </form>
        </div>

        <!-- TABEL DATA SETORAN -->
        <div class="glass-card rounded-3xl p-7 shadow-xl">
          <div class="flex items-center justify-between mb-6">
            <h3 class="text-lg font-bold text-white flex items-center gap-2">
              <i data-lucide="list-checks" class="w-5 h-5 text-emerald-400"></i> Riwayat Verifikasi Email
            </h3>
            <span class="text-xs text-slate-400 font-mono" x-text="`Total: ${submissions.length} Record`"></span>
          </div>

          <div class="overflow-x-auto rounded-2xl border border-slate-800/80">
            <table class="w-full text-left text-xs text-slate-300">
              <thead class="bg-slate-950/80 text-slate-400 font-semibold uppercase tracking-wider border-b border-slate-800/80">
                <tr>
                  <th class="py-4 px-5">Email Target</th>
                  <th class="py-4 px-5">Recovery Email</th>
                  <th class="py-4 px-5">Komisi</th>
                  <th class="py-4 px-5">Status IMAP</th>
                  <th class="py-4 px-5">Keterangan Server</th>
                  <th class="py-4 px-5">Waktu Submit</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-800/60 font-mono">
                <template x-for="item in submissions" :key="item.id">
                  <tr class="hover:bg-slate-800/30 transition-colors">
                    <td class="py-4 px-5 font-semibold text-white" x-text="item.email"></td>
                    <td class="py-4 px-5 text-slate-400" x-text="item.recovery_email || '-'"></td>
                    <td class="py-4 px-5 text-emerald-400 font-bold" x-text="formatRupiah(item.price)"></td>
                    <td class="py-4 px-5 font-sans">
                      <span class="px-3 py-1 rounded-full text-[11px] font-bold inline-flex items-center gap-1.5"
                            :class="{
                              'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20': item.status === 'approved',
                              'bg-rose-500/10 text-rose-400 border border-rose-500/20': item.status === 'rejected',
                              'bg-amber-500/10 text-amber-400 border border-amber-500/20': item.status === 'pending'
                            }">
                        <span class="w-1.5 h-1.5 rounded-full" :class="{
                          'bg-emerald-400 shadow-[0_0_8px_#34d399]': item.status === 'approved',
                          'bg-rose-400 shadow-[0_0_8px_#f87171]': item.status === 'rejected',
                          'bg-amber-400 animate-ping': item.status === 'pending'
                        }"></span>
                        <span x-text="item.status.toUpperCase()"></span>
                      </span>
                    </td>
                    <td class="py-4 px-5 font-sans text-slate-400" x-text="item.reason || '-'"></td>
                    <td class="py-4 px-5 font-sans text-slate-500" x-text="formatDate(item.created_at)"></td>
                  </tr>
                </template>
                <template x-if="submissions.length === 0">
                  <tr>
                    <td colspan="6" class="text-center py-12 text-slate-500 font-sans">
                      <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2 opacity-30"></i>
                      Belum ada akun email yang disetor.
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </template>
  </main>

  <!-- MODAL WITHDRAW -->
  <template x-if="showWithdrawModal">
    <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
      <div class="glass-card rounded-3xl max-w-md w-full p-7 shadow-2xl relative glow-purple space-y-5">
        <div class="flex items-center justify-between border-b border-slate-800 pb-4">
          <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center">
              <i data-lucide="building-bank" class="w-5 h-5"></i>
            </div>
            <h3 class="text-lg font-bold text-white">Form Penarikan Saldo</h3>
          </div>
          <button @click="showWithdrawModal = false" class="text-slate-400 hover:text-white transition">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <form @submit.prevent="submitWithdraw()" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Pilih E-Wallet / Bank</label>
            <select x-model="withdrawForm.payment_method" class="w-full glass-input rounded-xl px-4 py-3 text-sm text-white focus:outline-none">
              <option value="DANA" class="bg-slate-900">DANA</option>
              <option value="GOPAY" class="bg-slate-900">GoPay</option>
              <option value="OVO" class="bg-slate-900">OVO</option>
              <option value="SHOPEEPAY" class="bg-slate-900">ShopeePay</option>
              <option value="BCA" class="bg-slate-900">Bank BCA</option>
              <option value="BRI" class="bg-slate-900">Bank BRI</option>
              <option value="MANDIRI" class="bg-slate-900">Bank Mandiri</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Nomor Rekening / HP</label>
            <input type="text" x-model="withdrawForm.account_number" required placeholder="081234567890" class="w-full glass-input rounded-xl px-4 py-3 text-sm text-white focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Nama Pemilik Akun</label>
            <input type="text" x-model="withdrawForm.account_name" required placeholder="Ahmad Subagyo" class="w-full glass-input rounded-xl px-4 py-3 text-sm text-white focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Jumlah Penarikan (Rp)</label>
            <input type="number" x-model="withdrawForm.amount" min="10000" required placeholder="50000" class="w-full glass-input rounded-xl px-4 py-3 text-sm text-white focus:outline-none">
            <span class="text-[11px] text-slate-400 mt-1 block">Minimal penarikan saldo sebesar Rp 10.000</span>
          </div>

          <div class="pt-3 flex space-x-3">
            <button type="button" @click="showWithdrawModal = false" class="w-1/2 py-3 glass-input text-slate-300 hover:text-white rounded-xl text-xs font-semibold transition">Batal</button>
            <button type="submit" class="w-1/2 py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-emerald-600/20 transition">Kirim Pengajuan</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- SCRIPT LOGIC -->
  <script>
    function appData() {
      return {
        token: localStorage.getItem('token') || null,
        user: JSON.parse(localStorage.getItem('user') || '{}'),
        isRegister: false,
        loading: false,
        rawAccounts: '',
        submissions: [],
        showWithdrawModal: false,

        authForm: { name: '', email: '', password: '' },
        withdrawForm: { payment_method: 'DANA', account_number: '', account_name: '', amount: '' },

        initApp() {
          if (this.token) {
            this.fetchProfile();
            this.loadSubmissions();
            setInterval(() => this.loadSubmissions(), 5000);
          }
          this.$nextTick(() => lucide.createIcons());
        },

        async handleAuth() {
          const endpoint = this.isRegister ? '/api/auth/register' : '/api/auth/login';
          try {
            const res = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(this.authForm)
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Terjadi kesalahan');

            this.token = data.token;
            this.user = data.user;
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            this.initApp();
          } catch (err) {
            alert(err.message);
          }
        },

        logout() {
          this.token = null;
          this.user = {};
          localStorage.removeItem('token');
          localStorage.removeItem('user');
        },

        async fetchProfile() {
          try {
            const res = await fetch('/api/user/me', {
              headers: { 'Authorization': `Bearer ${this.token}` }
            });
            if (res.ok) {
              this.user = await res.json();
              localStorage.setItem('user', JSON.stringify(this.user));
            }
          } catch (e) {}
        },

        async submitBulk() {
          if (!this.rawAccounts.trim()) return alert('Masukkan data email terlebih dahulu.');
          this.loading = true;

          try {
            const res = await fetch('/api/submissions/bulk', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${this.token}`
              },
              body: JSON.stringify({ rawText: this.rawAccounts })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error);

            alert(data.message);
            this.rawAccounts = '';
            this.loadSubmissions();
          } catch (err) {
            alert(err.message);
          } finally {
            this.loading = false;
          }
        },

        async loadSubmissions() {
          try {
            const res = await fetch('/api/submissions', {
              headers: { 'Authorization': `Bearer ${this.token}` }
            });
            if (res.ok) {
              this.submissions = await res.json();
              this.fetchProfile();
            }
          } catch (e) {}
        },

        async submitWithdraw() {
          try {
            const res = await fetch('/api/withdrawals', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${this.token}`
              },
              body: JSON.stringify(this.withdrawForm)
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error);

            alert(data.message);
            this.showWithdrawModal = false;
            this.fetchProfile();
          } catch (err) {
            alert(err.message);
          }
        },

        countLines(str) {
          if (!str) return 0;
          return str.split('\n').filter(l => l.trim().length > 0).length;
        },

        formatRupiah(amount) {
          return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(amount);
        },

        formatDate(dateStr) {
          if (!dateStr) return '-';
          return new Date(dateStr).toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' });
        }
      }
    }
  </script>
</body>
</html>
